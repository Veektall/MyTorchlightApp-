name: Public Facebook Preserved Tightened Cuts

on:
  push:
    branches: [main]
    paths:
      - '.trigger/facebook-preserved-tightened-cuts.json'

permissions:
  contents: read
  actions: read

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Parse request
        id: req
        run: |
          python - <<'PY'
          import json,re,os
          d=json.load(open('.trigger/facebook-preserved-tightened-cuts.json'))
          job=d['job_id'].strip(); run_id=str(d['source_run_id']); artifact=d['artifact_name'].strip(); clips=d['clips']
          expected=d['expected_source_sha256'].strip().lower()
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,128}',job): raise SystemExit('bad job_id')
          if not run_id.isdigit(): raise SystemExit('bad source_run_id')
          if not artifact.startswith('source-'): raise SystemExit('bad artifact_name')
          if not re.fullmatch(r'[0-9a-f]{64}',expected): raise SystemExit('bad source hash')
          if len(clips)!=6: raise SystemExit('exactly six clips required')
          for i,c in enumerate(clips,1):
              if c['index']!=i: raise SystemExit('bad clip index')
              if not re.fullmatch(r'[A-Za-z0-9._-]+\.mp4',c['filename']): raise SystemExit('bad filename')
              rs=float(c['raw_start']); re_=float(c['raw_end'])
              if re_<=rs: raise SystemExit('bad raw range')
              segs=c.get('segments') or []
              if not segs: raise SystemExit('missing retained segments')
              last=rs
              for s in segs:
                  a=float(s['start']); b=float(s['end'])
                  if b<=a or a<rs-0.001 or b>re_+0.001 or a<last-0.001: raise SystemExit('bad segment map')
                  last=b
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'job_id={job}\nrun_id={run_id}\nartifact={artifact}\nexpected={expected}\n')
          PY

      - name: Download exact preserved source
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.req.outputs.artifact }}
          path: source-artifact
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip

      - name: Verify preserved source
        id: source
        env:
          JOB_ID: ${{ steps.req.outputs.job_id }}
          EXPECTED: ${{ steps.req.outputs.expected }}
        run: |
          set -euo pipefail
          mkdir -p "out/$JOB_ID/clips"
          SRC="$(find source-artifact -type f -name 'source.mp4' -size +0c | head -1)"
          test -n "$SRC"; test -s "$SRC"
          ACTUAL="$(sha256sum "$SRC" | awk '{print $1}')"
          echo "$ACTUAL  $SRC" | tee "out/$JOB_ID/source-sha256.txt"
          test "$ACTUAL" = "$EXPECTED"
          ffprobe -v error -show_format -show_streams -of json "$SRC" > "out/$JOB_ID/source-ffprobe.json"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

      - name: Remove transcript-defined dead spaces and render six clips
        env:
          JOB_ID: ${{ steps.req.outputs.job_id }}
          SRC: ${{ steps.source.outputs.src }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,pathlib,os
          d=json.load(open('.trigger/facebook-preserved-tightened-cuts.json'))
          j=os.environ['JOB_ID']; src=os.environ['SRC']
          outdir=pathlib.Path(f'out/{j}/clips'); outdir.mkdir(parents=True,exist_ok=True)
          source_probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',src]))
          sv=next(s for s in source_probe['streams'] if s.get('codec_type')=='video')
          source_wh=(int(sv['width']),int(sv['height']))
          manifest=[]
          for c in d['clips']:
              raw_start=float(c['raw_start']); raw_end=float(c['raw_end']); raw_dur=raw_end-raw_start
              segs=[(float(x['start']),float(x['end'])) for x in c['segments']]
              expected=sum(b-a for a,b in segs)
              removed=raw_dur-expected
              out=str(outdir/c['filename'])
              filters=[]; concat=[]
              for k,(a,b) in enumerate(segs):
                  ra=a-raw_start; rb=b-raw_start
                  filters.append(f'[0:v]trim=start={ra:.3f}:end={rb:.3f},setpts=PTS-STARTPTS[v{k}]')
                  filters.append(f'[0:a]atrim=start={ra:.3f}:end={rb:.3f},asetpts=PTS-STARTPTS[a{k}]')
                  concat.append(f'[v{k}][a{k}]')
              filters.append(''.join(concat)+f'concat=n={len(segs)}:v=1:a=1[outv][outa]')
              cmd=['ffmpeg','-y','-v','error','-ss',f'{raw_start:.3f}','-i',src,'-t',f'{raw_dur:.3f}',
                   '-filter_complex',';'.join(filters),'-map','[outv]','-map','[outa]',
                   '-c:v','libx264','-preset','fast','-crf','18','-pix_fmt','yuv420p',
                   '-c:a','aac','-b:a','192k','-movflags','+faststart',out]
              subprocess.run(cmd,check=True)
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',out]))
              actual=float(probe['format']['duration'])
              streams=probe['streams']; vids=[s for s in streams if s.get('codec_type')=='video']; auds=[s for s in streams if s.get('codec_type')=='audio']
              if abs(actual-expected)>0.45: raise SystemExit(f'duration mismatch {c["filename"]}: {actual} vs {expected}')
              if not vids or not auds: raise SystemExit(f'missing A/V stream in {c["filename"]}')
              if (int(vids[0]['width']),int(vids[0]['height'])) != source_wh: raise SystemExit(f'resolution changed in {c["filename"]}')
              subprocess.run(['ffmpeg','-v','error','-i',out,'-f','null','-'],check=True)
              manifest.append({
                  'index':c['index'],'filename':c['filename'],'raw_start':raw_start,'raw_end':raw_end,
                  'raw_duration':round(raw_dur,3),'retained_sections':[{'start':a,'end':b} for a,b in segs],
                  'retained_section_count':len(segs),'expected_tightened_duration':round(expected,3),
                  'actual_duration':actual,'dead_space_removed_seconds':round(removed,3),
                  'resolution':f'{source_wh[0]}x{source_wh[1]}',
                  'edit':'original-order speech retained; transcript-defined internal dead spaces removed only'
              })
          pathlib.Path(f'out/{j}/clips-manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY

      - name: Package and verify final ZIP
        env:
          JOB_ID: ${{ steps.req.outputs.job_id }}
        run: |
          set -euo pipefail
          test "$(find "out/$JOB_ID/clips" -maxdepth 1 -name '*.mp4' | wc -l)" -eq 6
          cd "out/$JOB_ID/clips"
          zip -0 -j "../${JOB_ID}_6_tightened_viral_clips.zip" ./*.mp4
          cd - >/dev/null
          unzip -t "out/$JOB_ID/${JOB_ID}_6_tightened_viral_clips.zip"
          test "$(unzip -Z1 "out/$JOB_ID/${JOB_ID}_6_tightened_viral_clips.zip" | grep -c '\.mp4$')" -eq 6
          sha256sum "out/$JOB_ID/${JOB_ID}_6_tightened_viral_clips.zip" > "out/$JOB_ID/final-zip-sha256.txt"

      - name: Upload final deliverable
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ steps.req.outputs.job_id }}
          path: |
            out/${{ steps.req.outputs.job_id }}/${{ steps.req.outputs.job_id }}_6_tightened_viral_clips.zip
            out/${{ steps.req.outputs.job_id }}/clips-manifest.json
            out/${{ steps.req.outputs.job_id }}/source-sha256.txt
            out/${{ steps.req.outputs.job_id }}/source-ffprobe.json
            out/${{ steps.req.outputs.job_id }}/final-zip-sha256.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
