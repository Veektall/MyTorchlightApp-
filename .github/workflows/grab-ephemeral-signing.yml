name: Grab ephemeral signing
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: read
jobs:
  sign:
    if: startsWith(github.event.issue.title, 'grab-signing-session:') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sign verified Grab APK
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          W=/tmp/grab-sign; mkdir -p "$W"
          cleanup(){ rm -f "$W/session-private.pem" "$W/aes.key" "$W/plain.json" "$W/release.p12" "$W/password.txt"; }
          trap cleanup EXIT
          unsigned_url="$(jq -r '.unsigned_url // empty' <<< "$ISSUE_BODY")"
          unsigned_sha="$(jq -r '.unsigned_sha256 // empty' <<< "$ISSUE_BODY" | tr A-F a-f)"
          [[ "$unsigned_url" == https://* && "$unsigned_sha" =~ ^[0-9a-f]{64}$ ]]
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$W/session-private.pem" >/dev/null 2>&1
          openssl pkey -in "$W/session-private.pem" -pubout -out "$W/session-public.pem"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "GRAB_SIGNING_SESSION_PUBLIC_KEY $(base64 -w0 "$W/session-public.pem")"
          envline=''
          for i in $(seq 1 120); do
            envline="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --paginate | jq -r --arg o "$GITHUB_REPOSITORY_OWNER" '[.[]|select(.user.login==$o)|.body|select(startswith("GRAB_SIGNING_SESSION_ENVELOPE "))]|last // ""')"
            [[ -n "$envline" ]] && break; sleep 5
          done
          [[ -n "$envline" ]]
          sealed="${envline#GRAB_SIGNING_SESSION_ENVELOPE }"
          jq -r '.wrapped_key' <<< "$sealed" | base64 -d > "$W/wrapped.bin"
          jq -r '.iv' <<< "$sealed" | base64 -d > "$W/iv.bin"
          jq -r '.ciphertext' <<< "$sealed" | base64 -d > "$W/cipher.bin"
          openssl pkeyutl -decrypt -inkey "$W/session-private.pem" -in "$W/wrapped.bin" -out "$W/aes.key" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          node - "$W" <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),w=process.argv[2];
          const k=fs.readFileSync(w+'/aes.key'),iv=fs.readFileSync(w+'/iv.bin'),all=fs.readFileSync(w+'/cipher.bin');
          const d=crypto.createDecipheriv('aes-256-gcm',k,iv);d.setAuthTag(all.subarray(all.length-16));
          fs.writeFileSync(w+'/plain.json',Buffer.concat([d.update(all.subarray(0,all.length-16)),d.final()]));
          NODE
          jq -r '.p12_b64' "$W/plain.json" | base64 -d > "$W/release.p12"
          jq -r '.password' "$W/plain.json" > "$W/password.txt"
          rm -f "$W/plain.json" "$W/wrapped.bin" "$W/aes.key" "$W/iv.bin" "$W/cipher.bin"
          curl -fL --retry 3 --max-time 240 "$unsigned_url" -o "$W/unsigned.apk"
          echo "$unsigned_sha  $W/unsigned.apk" | sha256sum -c -
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0' >/dev/null
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -P 16 -f 4 "$W/unsigned.apk" "$W/aligned.apk"
          "$BT/apksigner" sign --ks "$W/release.p12" --ks-key-alias grab-release --ks-pass "file:$W/password.txt" --key-pass "file:$W/password.txt" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "$W/Grab-by-Rhoda-v3.2.apk" "$W/aligned.apk"
          "$BT/zipalign" -c -P 16 -v 4 "$W/Grab-by-Rhoda-v3.2.apk" >/dev/null
          "$BT/apksigner" verify --verbose --print-certs "$W/Grab-by-Rhoda-v3.2.apk" > "$W/verify.txt"
          signer="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2);exit}' "$W/verify.txt")"
          [[ "$signer" == b3e45007cac42ff03bec33c39429a43af5d12a946c840b9062eb09b10c51ee33 ]]
          "$BT/aapt" dump badging "$W/Grab-by-Rhoda-v3.2.apk" > "$W/badging.txt"
          grep -q "package: name='com.veektall.grab' versionCode='5' versionName='3.2'" "$W/badging.txt"
          grep -q "sdkVersion:'29'" "$W/badging.txt"; grep -q "targetSdkVersion:'36'" "$W/badging.txt"
          final_sha="$(sha256sum "$W/Grab-by-Rhoda-v3.2.apk"|awk '{print $1}')"
          j="$(curl --fail --show-error --silent --max-time 240 -X POST https://tempfile.org/api/upload/local -F "files=@$W/Grab-by-Rhoda-v3.2.apk;type=application/vnd.android.package-archive" -F 'expiryHours=24')"
          id="$(jq -r 'if .success and (.files|length)>0 then .files[0].id else empty end' <<< "$j")"; [[ -n "$id" ]]
          url="https://tempfile.org/$id/download"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "GRAB_SIGNING_SESSION_COMPLETE
          download_url=$url
          sha256=$final_sha
          signer_sha256=$signer"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
