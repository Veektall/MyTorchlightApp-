name: Telegram v5.2 unified relay

on:
  issues:
    types: [opened]

permissions:
  issues: write
  id-token: write

jobs:
  relay:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'telegram-v52:') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver encrypted Telegram v5.2 payload
        env:
          ENDPOINT: https://kwulmnvxhybbxlsdcwcn.supabase.co/functions/v1/telegram-unified-relay-v52
          SEALED: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Telegram v5.2 relay failed."
            exit 1
          }
          trap fail ERR
          jq -e '.v == 1 and (.wrapped_key | type == "string") and (.iv | type == "string") and (.ciphertext | type == "string")' <<< "$SEALED" >/dev/null
          token_response="$(curl --fail-with-body -sS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=telegram-status-relay")"
          oidc="$(jq -r '.value // empty' <<< "$token_response")"
          test -n "$oidc"
          payload="$(jq -n --argjson sealed "$SEALED" '{sealed:$sealed}')"
          response_file="$(mktemp)"
          http_code="$(curl -sS --max-time 90 -o "$response_file" -w '%{http_code}' -X POST "$ENDPOINT" -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" -d "$payload")"
          response="$(cat "$response_file")"
          rm -f "$response_file"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ] || [ "$(jq -r '.ok // false' <<< "$response" 2>/dev/null || echo false)" != "true" ]; then
            diagnostic="$(jq -r '.detail // .error // "unknown"' <<< "$response" 2>/dev/null | tr '\n' ' ' | cut -c1-300 || true)"
            echo "Relay diagnostic: ${diagnostic:-unknown}"
            false
          fi
          trap - ERR
          if [ "$(jq -r '.dry_run // false' <<< "$response")" = "true" ]; then
            kind="$(jq -r '.kind // "unknown"' <<< "$response")"
            parts="$(jq -r '.parts // 1' <<< "$response")"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Telegram v5.2 preflight passed. Kind: $kind; parts: $parts."
          else
            message_id="$(jq -r '.message_id // "confirmed"' <<< "$response")"
            message_ids="$(jq -c '.message_ids // [.message_id]' <<< "$response")"
            thread_id="$(jq -r '.thread_id // "unknown"' <<< "$response")"
            expires_at="$(jq -r '.expires_at // "unknown"' <<< "$response")"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Telegram v5.2 delivered successfully. Message ID: $message_id; Message IDs: $message_ids; Thread ID: $thread_id; Reply window expires: $expires_at"
          fi
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
