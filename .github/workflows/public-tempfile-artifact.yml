name: Public TempFile Artifact Relay

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  relay:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, 'public-tempfile-artifact:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Parse request
        id: req
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
import json,os,re
x=json.loads(os.environ['BODY'])
a=int(x['artifact_id']); name=x.get('filename','artifact.zip')
if not re.fullmatch(r'[A-Za-z0-9._-]+',name): raise SystemExit('invalid filename')
with open(os.environ['GITHUB_OUTPUT'],'a') as f:
 f.write(f'artifact_id={a}\nfilename={name}\n')
PY
      - name: Download final artifact
        env:
          GH_TOKEN: ${{ github.token }}
          AID: ${{ steps.req.outputs.artifact_id }}
          NAME: ${{ steps.req.outputs.filename }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" -o "/tmp/$NAME"
          test -s "/tmp/$NAME"
          test "$(stat -c%s "/tmp/$NAME")" -le 104857600
      - name: Upload to TempFile.org
        id: up
        env:
          NAME: ${{ steps.req.outputs.filename }}
        run: |
          set -euo pipefail
          curl -fSs --retry 3 -X POST https://tempfile.org/api/upload/local -F "files=@/tmp/$NAME" -F "expiryHours=48" -o /tmp/response.json
          jq -e '.success == true and (.files|length) == 1' /tmp/response.json >/dev/null
          URL="$(jq -r '.files[0].url' /tmp/response.json)"
          DIRECT="${URL%/}/download"
          EXP="$(jq -r '.files[0].expiryTime' /tmp/response.json)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "direct=$DIRECT" >> "$GITHUB_OUTPUT"
          echo "expiry=$EXP" >> "$GITHUB_OUTPUT"
      - name: Verify temporary file
        env:
          DIRECT: ${{ steps.up.outputs.direct }}
        run: curl -fLsSI --max-time 30 "$DIRECT" >/dev/null
      - name: Report link
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          URL: ${{ steps.up.outputs.url }}
          DIRECT: ${{ steps.up.outputs.direct }}
          EXP: ${{ steps.up.outputs.expiry }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "TempFile upload verified. URL: $URL Direct: $DIRECT ExpiryEpochMs: $EXP"
