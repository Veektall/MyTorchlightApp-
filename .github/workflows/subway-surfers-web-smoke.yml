name: Official Subway Surfers Web Smoke

on:
  push:
    branches: [pixel-subway-acquire]
    paths:
      - 'subway-surfers-web-trigger.txt'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Boot official Subway Surfers and exercise controls
        run: |
          set -euxo pipefail
          mkdir -p /tmp/subway-web
          cat > subway-web-run.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true, args:['--autoplay-policy=no-user-gesture-required']});
            const context = await browser.newContext({
              viewport:{width:1280,height:720},
              recordVideo:{dir:'/tmp/subway-web/video', size:{width:1280,height:720}},
              locale:'en-US'
            });
            const page = await context.newPage();
            page.on('console', m=>fs.appendFileSync('/tmp/subway-web/console.log', `[${m.type()}] ${m.text()}\n`));
            page.on('pageerror', e=>fs.appendFileSync('/tmp/subway-web/pageerror.log', String(e)+'\n'));
            await page.goto('https://poki.com/en/g/subway-surfers',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(10000);
            for (const txt of ['Accept','Accept all','I agree','Continue','Play','Start game','No thanks']) {
              const loc=page.getByText(txt,{exact:false}).first();
              try { if (await loc.isVisible({timeout:500})) { await loc.click({timeout:1000}); await page.waitForTimeout(1000);} } catch(e){}
            }
            await page.screenshot({path:'/tmp/subway-web/01-loaded.png',fullPage:false});
            const frames=page.frames().map(f=>({url:f.url(),name:f.name()}));
            fs.writeFileSync('/tmp/subway-web/frames.json',JSON.stringify(frames,null,2));
            fs.writeFileSync('/tmp/subway-web/page.html',await page.content());
            await page.mouse.click(640,420);
            await page.waitForTimeout(1000);
            await page.keyboard.press('Enter');
            await page.waitForTimeout(3000);
            const actions=['ArrowUp','ArrowLeft','ArrowRight','ArrowDown','ArrowUp','ArrowRight','ArrowUp','ArrowLeft','Space'];
            for (const a of actions) { await page.keyboard.press(a); await page.waitForTimeout(1200); }
            await page.screenshot({path:'/tmp/subway-web/02-after-controls.png',fullPage:false});
            await page.waitForTimeout(8000);
            await page.screenshot({path:'/tmp/subway-web/03-final.png',fullPage:false});
            const video=page.video();
            await page.close();
            await context.close();
            if (video) fs.writeFileSync('/tmp/subway-web/video-path.txt', await video.path());
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node subway-web-run.js
          VIDEO=$(cat /tmp/subway-web/video-path.txt)
          cp "$VIDEO" /tmp/subway-web/official-subway-surfers-smoke.webm
          ffmpeg -y -loglevel warning -i /tmp/subway-web/official-subway-surfers-smoke.webm -c:v libx264 -pix_fmt yuv420p /tmp/subway-web/official-subway-surfers-smoke.mp4
          ls -lh /tmp/subway-web
      - uses: actions/upload-artifact@v4
        with:
          name: official-subway-surfers-web-smoke
          path: /tmp/subway-web
          retention-days: 1
          if-no-files-found: error
