name: Official Subway Surfers Web Smoke

on:
  push:
    branches: [pixel-subway-acquire]
    paths:
      - 'subway-surfers-web-trigger.txt'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Boot official Subway Surfers canvas and exercise controls
        run: |
          set -euxo pipefail
          mkdir -p /tmp/subway-web/canvas
          cat > subway-web-run.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true, args:['--autoplay-policy=no-user-gesture-required']});
            const context = await browser.newContext({
              viewport:{width:1280,height:720},
              recordVideo:{dir:'/tmp/subway-web/video', size:{width:1280,height:720}},
              locale:'en-US'
            });
            const page = await context.newPage();
            page.on('console', m=>fs.appendFileSync('/tmp/subway-web/console.log', `[${m.type()}] ${m.text()}\n`));
            page.on('pageerror', e=>fs.appendFileSync('/tmp/subway-web/pageerror.log', String(e)+'\n'));
            await page.goto('https://poki.com/en/g/subway-surfers',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(12000);
            const frames=page.frames();
            fs.writeFileSync('/tmp/subway-web/frames.json',JSON.stringify(frames.map(f=>({url:f.url(),name:f.name()})),null,2));
            const game=frames[frames.length-1];
            const canvases=game.locator('canvas');
            const count=await canvases.count();
            const info=[];
            for(let i=0;i<count;i++) { try { info.push({i,box:await canvases.nth(i).boundingBox()}); } catch(e){} }
            fs.writeFileSync('/tmp/subway-web/canvas-info.json',JSON.stringify({count,info,gameUrl:game.url()},null,2));
            if(!count) throw new Error('No game canvas found');
            let canvas=canvases.first();
            // choose the largest canvas if multiple exist
            let best=-1,bestArea=-1;
            for(let i=0;i<count;i++){ const b=await canvases.nth(i).boundingBox(); if(b&&b.width*b.height>bestArea){best=i;bestArea=b.width*b.height;} }
            if(best>=0) canvas=canvases.nth(best);
            await canvas.screenshot({path:'/tmp/subway-web/canvas/00-before.png'});
            const box=await canvas.boundingBox();
            if(box) await canvas.click({position:{x:Math.max(2,box.width/2),y:Math.max(2,box.height/2)}});
            await page.waitForTimeout(500);
            // Try normal start inputs, then a short controlled action sequence.
            for(const a of ['Enter','ArrowUp','Space']) { await page.keyboard.press(a); await page.waitForTimeout(1200); }
            await canvas.screenshot({path:'/tmp/subway-web/canvas/01-started.png'});
            const actions=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','ArrowRight','ArrowUp','ArrowLeft','ArrowDown','ArrowRight','ArrowUp'];
            let n=2;
            for (const a of actions) {
              await page.keyboard.press(a);
              await page.waitForTimeout(900);
              await canvas.screenshot({path:`/tmp/subway-web/canvas/${String(n++).padStart(2,'0')}-${a}.png`});
            }
            await page.waitForTimeout(5000);
            await canvas.screenshot({path:'/tmp/subway-web/canvas/99-final.png'});
            const video=page.video();
            await page.close(); await context.close();
            if(video) fs.writeFileSync('/tmp/subway-web/video-path.txt',await video.path());
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node subway-web-run.js
          VIDEO=$(cat /tmp/subway-web/video-path.txt)
          cp "$VIDEO" /tmp/subway-web/official-subway-surfers-canvas.webm
          ffmpeg -y -loglevel warning -i /tmp/subway-web/official-subway-surfers-canvas.webm -c:v libx264 -pix_fmt yuv420p /tmp/subway-web/official-subway-surfers-canvas.mp4
          ls -lh /tmp/subway-web /tmp/subway-web/canvas
      - uses: actions/upload-artifact@v4
        with:
          name: official-subway-surfers-web-smoke
          path: /tmp/subway-web
          retention-days: 1
          if-no-files-found: error
