name: Official Subway Surfers Web Smoke

on:
  push:
    branches: [pixel-subway-acquire]
    paths:
      - 'subway-surfers-web-trigger.txt'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headed browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg mesa-utils
      - name: Run official Subway Surfers with WebGL
        continue-on-error: true
        run: |
          set -uxo pipefail
          rm -rf /tmp/subway-web && mkdir -p /tmp/subway-web/game
          cat > subway-web-run.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const OUT='/tmp/subway-web'; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function safe(name,fn){try{return await fn()}catch(e){fs.appendFileSync(`${OUT}/errors.log`,`${name}: ${e.stack||e}\n`);return null}}
          async function webglInfo(frame){return frame.evaluate(()=>{
            const c=document.createElement('canvas');
            const gl=c.getContext('webgl2')||c.getContext('webgl');
            if(!gl)return {ok:false};
            const ext=gl.getExtension('WEBGL_debug_renderer_info');
            return {ok:true,version:gl.getParameter(gl.VERSION),vendor:ext?gl.getParameter(ext.UNMASKED_VENDOR_WEBGL):gl.getParameter(gl.VENDOR),renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)};
          })}
          (async()=>{
            const browser=await chromium.launch({headless:false,args:[
              '--autoplay-policy=no-user-gesture-required','--enable-webgl','--ignore-gpu-blocklist',
              '--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader-webgl',
              '--disable-dev-shm-usage','--no-sandbox'
            ]});
            const context=await browser.newContext({viewport:{width:1280,height:720},locale:'en-US',recordVideo:{dir:`${OUT}/video`,size:{width:1280,height:720}}});
            const page=await context.newPage();
            page.on('console',m=>fs.appendFileSync(`${OUT}/console.log`,`[${m.type()}] ${m.text()}\n`));
            page.on('pageerror',e=>fs.appendFileSync(`${OUT}/pageerror.log`,String(e)+'\n'));
            fs.writeFileSync(`${OUT}/top-webgl.json`,JSON.stringify(await webglInfo(page),null,2));
            await page.goto('https://poki.com/en/g/subway-surfers',{waitUntil:'domcontentloaded',timeout:120000});
            await sleep(18000);
            const frames=page.frames();
            fs.writeFileSync(`${OUT}/frames.json`,JSON.stringify(frames.map((f,i)=>({i,name:f.name(),url:f.url()})),null,2));
            const candidates=frames.filter(f=>f.url().includes('.gdn.poki.com'));
            const game=candidates[candidates.length-1]||frames[frames.length-1];
            fs.writeFileSync(`${OUT}/game-url.txt`,game.url());
            fs.writeFileSync(`${OUT}/game-webgl.json`,JSON.stringify(await webglInfo(game),null,2));
            const state=await game.evaluate(()=>({title:document.title,text:(document.body?.innerText||'').slice(0,2000),canvasCount:document.querySelectorAll('canvas').length,html:(document.body?.innerHTML||'').slice(0,8000)}));
            fs.writeFileSync(`${OUT}/game-state.json`,JSON.stringify(state,null,2));
            await safe('body-before',()=>game.locator('body').screenshot({path:`${OUT}/game/00-before.png`}));
            const canvas=game.locator('canvas').first();
            if(await canvas.count()){
              await safe('canvas-click',()=>canvas.click({position:{x:400,y:280},force:true}));
            } else {
              await safe('body-click',async()=>{const b=await game.locator('body').boundingBox();if(b)await game.locator('body').click({position:{x:b.width/2,y:b.height/2},force:true})});
            }
            await sleep(700);
            // Start/menu attempts, then real desktop movement controls.
            for(const key of ['Enter','Space','ArrowUp']){await safe('start-'+key,()=>game.locator('body').press(key));await sleep(1300)}
            await safe('started-shot',()=>game.locator('body').screenshot({path:`${OUT}/game/01-started.png`}));
            const seq=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','ArrowLeft','ArrowUp','ArrowRight','ArrowDown','ArrowRight','ArrowUp','ArrowLeft','ArrowUp'];
            let i=2;
            for(const key of seq){
              await safe('key-'+key,()=>game.locator('body').press(key)); await sleep(800);
              await safe('shot-'+i,()=>game.locator('body').screenshot({path:`${OUT}/game/${String(i++).padStart(2,'0')}-${key}.png`}));
            }
            await sleep(5000); await safe('final-shot',()=>game.locator('body').screenshot({path:`${OUT}/game/99-final.png`}));
            const final=await game.evaluate(()=>({text:(document.body?.innerText||'').slice(0,2000),canvasCount:document.querySelectorAll('canvas').length}));
            fs.writeFileSync(`${OUT}/game-final-state.json`,JSON.stringify(final,null,2));
            const v=page.video(); await page.close(); await context.close();
            if(v){const p=await v.path();fs.copyFileSync(p,`${OUT}/official-subway-surfers-headed.webm`)}
            await browser.close();
          })().catch(e=>{fs.writeFileSync(`${OUT}/fatal.txt`,String(e.stack||e));process.exitCode=1});
          JS
          xvfb-run -a -s '-screen 0 1280x720x24' node subway-web-run.js
          if [ -f /tmp/subway-web/official-subway-surfers-headed.webm ]; then
            ffmpeg -y -loglevel warning -i /tmp/subway-web/official-subway-surfers-headed.webm -c:v libx264 -pix_fmt yuv420p /tmp/subway-web/official-subway-surfers-headed.mp4 || true
          fi
          find /tmp/subway-web -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-subway-surfers-web-smoke
          path: /tmp/subway-web
          retention-days: 1
          if-no-files-found: error
