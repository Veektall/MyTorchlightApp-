name: Pixel Subway Dataset Collect

on:
  push:
    branches: [pixel-subway-acquire]
    paths:
      - '.github/workflows/pixel-subway-collect.yml'
      - 'pixel-subway-collect-trigger.txt'

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download instrumented authentic build
        uses: actions/download-artifact@v4
        with:
          name: pixel-subway-instrumented-build
          path: /tmp/pss-instrumented
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Veektall/MyTorchlightApp-
          run-id: 33245725819

      - name: Prepare capture runtime
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils xdotool
          python -m pip install --disable-pip-version-check --quiet mss pillow numpy
          chmod +x /tmp/pss-instrumented/publish/PixelSubwaySurfersInstrumented
          mkdir -p /tmp/pss-dataset/frames /tmp/pss-runtime

      - name: Run authentic game with telemetry teacher
        run: |
          set -uxo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > /tmp/pss-runtime/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 1
          pulseaudio --start --exit-idle-time=-1 --log-target=file:/tmp/pss-runtime/pulse.log || true
          sleep 1
          pactl load-module module-null-sink sink_name=virtual sink_properties=device.description=Virtual >/tmp/pss-runtime/pulse-module.txt || true
          pactl set-default-sink virtual || true

          cd /tmp/pss-instrumented/publish
          PSS_DIRECT_GAMEPLAY=1 PSS_TELEMETRY=/tmp/pss-runtime/telemetry.csv \
            ALSOFT_DRIVERS=pulse LIBGL_ALWAYS_SOFTWARE=1 \
            ./PixelSubwaySurfersInstrumented > /tmp/pss-runtime/game.log 2>&1 &
          GAME_PID=$!
          echo $GAME_PID > /tmp/pss-runtime/game.pid
          sleep 4
          xdotool mousemove 640 360 click 1 || true

          cat > /tmp/collector.py <<'PY'
          import csv, os, subprocess, time
          from pathlib import Path
          import numpy as np
          from PIL import Image
          import mss

          telemetry = Path('/tmp/pss-runtime/telemetry.csv')
          out = Path('/tmp/pss-dataset')
          frames = out/'frames'
          frames.mkdir(parents=True, exist_ok=True)
          manifest = open(out/'samples.csv','w',newline='')
          w = csv.writer(manifest)
          w.writerow(['sample','wall_s','game_ms','score','player_x','player_y','velocity_y','hoverboard','dead','hurdle_x','hurdle_y','hurdle_type','speed','ttc','grounded','jump_label','jump_sent'])

          def latest_state():
              try:
                  with open(telemetry,'rb') as f:
                      f.seek(0,2); n=f.tell(); f.seek(max(0,n-4096))
                      lines=f.read().decode('utf-8','ignore').strip().splitlines()
                  if not lines: return None
                  line=lines[-1]
                  if line.startswith('game_ms'): return None
                  p=line.split(',')
                  if len(p)<11: return None
                  return {
                      'game_ms':float(p[0]), 'score':int(p[1]), 'player_x':float(p[2]), 'player_y':float(p[3]),
                      'velocity_y':float(p[4]), 'hoverboard':int(p[5]), 'dead':int(p[6]),
                      'hurdle_x':float(p[7]), 'hurdle_y':float(p[8]), 'hurdle_type':int(p[9]), 'speed':float(p[10])
                  }
              except Exception:
                  return None

          # The Xvfb is 1280x720 and the game's fixed 1000x600 window is centered at (140,60).
          mon={'left':140,'top':60,'width':1000,'height':600}
          start=time.time(); last_jump=-10.0; sample=0; prev_hx=None
          sct=mss.mss()
          max_wall=105.0
          try:
              while time.time()-start < max_wall:
                  loop=time.time(); st=latest_state()
                  if st is None:
                      time.sleep(.02); continue
                  if st['dead']:
                      print('STOP dead score',st['score']); break
                  # Source-faithful causal variable: time until hurdle reaches player's x.
                  ttc=max(-2.0,min(5.0,(st['hurdle_x']-st['player_x'])/max(1.0,st['speed'])))
                  grounded=abs(st['velocity_y']) < 0.05
                  # Broad positive action window; teacher sends one edge when safely inside it.
                  jump_label=int(grounded and 0.48 <= ttc <= 0.82)
                  sent=0
                  now=time.time()
                  if jump_label and now-last_jump>0.35:
                      subprocess.run(['xdotool','key','space'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      last_jump=now; sent=1
                  raw=np.asarray(sct.grab(mon))[:,:,:3][:,:,::-1]  # RGB
                  im=Image.fromarray(raw).resize((200,120),Image.Resampling.NEAREST)
                  name=f'{sample:06d}.jpg'
                  im.save(frames/name,quality=86,subsampling=0)
                  w.writerow([name,now-start,st['game_ms'],st['score'],st['player_x'],st['player_y'],st['velocity_y'],st['hoverboard'],st['dead'],st['hurdle_x'],st['hurdle_y'],st['hurdle_type'],st['speed'],ttc,int(grounded),jump_label,sent])
                  if sample%100==0:
                      manifest.flush(); print('sample',sample,'score',st['score'],'speed',st['speed'],'ttc',round(ttc,3),'y',round(st['player_y'],1))
                  sample+=1
                  delay=max(0,0.10-(time.time()-loop))
                  time.sleep(delay)
          finally:
              manifest.flush(); manifest.close(); sct.close()
          print('COLLECTED',sample)
          PY

          python /tmp/collector.py | tee /tmp/pss-runtime/collector.log
          kill "$GAME_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          cp /tmp/pss-runtime/telemetry.csv /tmp/pss-dataset/telemetry.csv || true
          cp /tmp/pss-runtime/collector.log /tmp/pss-dataset/collector.log || true
          cp /tmp/pss-runtime/game.log /tmp/pss-dataset/game.log || true
          python - <<'PY'
          import csv, json, hashlib
          from pathlib import Path
          p=Path('/tmp/pss-dataset/samples.csv')
          rows=list(csv.DictReader(p.open()))
          speeds=[float(r['speed']) for r in rows]
          positives=sum(int(r['jump_label']) for r in rows)
          sent=sum(int(r['jump_sent']) for r in rows)
          summary={'samples':len(rows),'positive_labels':positives,'jump_edges_sent':sent,
                   'min_speed':min(speeds) if speeds else None,'max_speed':max(speeds) if speeds else None,
                   'csv_sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          Path('/tmp/pss-dataset/summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          du -sh /tmp/pss-dataset

      - name: Upload authentic visual dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-subway-visual-dataset
          path: /tmp/pss-dataset
          if-no-files-found: error
          retention-days: 1
