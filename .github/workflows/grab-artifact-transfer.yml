name: Grab Artifact Transfer
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  transfer:
    if: startsWith(github.event.issue.title, 'grab-artifact-transfer:') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download temporary Grab release asset
        env:
          URL: https://github.com/Veektall/MyTorchlightApp-/releases/download/grab-temp-31420196580/Grab-v2-arm64-unsigned.apk
        run: |
          set -euo pipefail
          curl -fL "$URL" -o Grab-v2-arm64-unsigned.apk
          test "$(sha256sum Grab-v2-arm64-unsigned.apk | awk '{print $1}')" = '79a7958c8d0471b1a553bedc64fc3b7d4df4780bbe4bedaa6a39f26697ba2fc3'
          ls -lh Grab-v2-arm64-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: grab-v2-transfer
          path: Grab-v2-arm64-unsigned.apk
          retention-days: 1
      - if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`GRAB_ARTIFACT_TRANSFER_OK\nRun ${context.runId}`});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});
      - if: failure()
        uses: actions/github-script@v8
        with:
          script: await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`GRAB_ARTIFACT_TRANSFER_FAILED\nRun ${context.runId}`});