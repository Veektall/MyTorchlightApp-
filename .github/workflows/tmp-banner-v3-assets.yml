name: Temporary Export Banner V3 Assets

on:
  pull_request:
    branches: [main]

jobs:
  export-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download public design assets and benchmark references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets refs
          fetch() { curl -L --fail --retry 3 --connect-timeout 30 -A 'Mozilla/5.0' "$1" -o "$2"; }
          fetch 'https://moniepoint.com/pos/smart-t.png' assets/moniepoint-front.png
          fetch 'https://waziri.ng/wp-content/uploads/2023/12/Softwave-Jumbo-Toilet-Tissue-Paper-x-12-rolls-1.jpg' assets/softwave-tissue.jpg
          fetch 'https://www.joshuaoladiti.com/images/kippa-img-1.jpg' refs/fintech-kippa.jpg
          fetch 'https://mir-s3-cdn-cf.behance.net/project_modules/max_632_webp/496828136387337.61f8ed216d070.png' refs/fintech-faysal.png
          fetch 'https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/d074d7248000035.69e7ad92e1db0.png' refs/fintech-qnb-1.png
          fetch 'https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/91ad24248000035.69e7ad92e35ec.png' refs/fintech-qnb-2.png
          fetch 'https://mir-s3-cdn-cf.behance.net/project_modules/max_632_webp/d062cb173580075.6492b7b7718c1.jpg' refs/retail-perks-1.jpg
          fetch 'https://mir-s3-cdn-cf.behance.net/project_modules/max_632_webp/aa2c79173580075.6492b7b77bbea.jpg' refs/retail-perks-2.jpg
          fetch 'https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/67d7a6191095969.65c542746c0df.png' refs/retail-mayshop-1.png
          fetch 'https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/7bed5a191095969.65c5427467773.png' refs/retail-mayshop-2.png
          file assets/* refs/*
      - uses: actions/upload-artifact@v4
        with:
          name: kings-world-banner-v3-assets
          path: assets
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kings-world-banner-v3-references
          path: refs
          if-no-files-found: error
