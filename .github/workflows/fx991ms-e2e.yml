name: fx-991MS Android E2E + Source

on:
  push:
    branches: [fx991ms-icon-v4]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Announce run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 133 --repo "$GITHUB_REPOSITORY" --body "fx-991MS icon/source Android gate START run ${GITHUB_RUN_ID}. Head ${GITHUB_SHA}. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rehydrate calculator source
        run: |
          { head -c 7000 fxparts/part00; cat fxparts/part01 fxparts/part02 fxparts/part03 fxparts/part04 fxparts/part05 fxparts/part06; } | base64 -d | tar -xzf -
          chmod +x gradlew ci/e2e-fixed.sh fxicon/apply-icon.sh
          test -s app/src/main/java/com/veektall/fx991ms/Engine.java
      - name: Apply launcher icon and version bump
        run: |
          bash fxicon/apply-icon.sh
          test -s app/src/main/res/drawable/fx991ms_app_icon.xml
          grep -q 'android:icon="@drawable/fx991ms_app_icon"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/fx991ms_app_icon"' app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Pure engine regression
        run: |
          rm -rf /tmp/fxclasses && mkdir -p /tmp/fxclasses
          javac -d /tmp/fxclasses app/src/main/java/com/veektall/fx991ms/Engine.java tools/EngineSelfTest.java
          java -cp /tmp/fxclasses com.veektall.fx991ms.EngineSelfTest | tee engine-test.txt
      - name: Build exact release candidate
        run: |
          ./gradlew --no-daemon clean :app:assembleRelease
          mkdir -p candidate
          cp app/build/outputs/apk/release/app-release.apk candidate/fx-991MS.apk
          (cd candidate && sha256sum fx-991MS.apk | tee SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 candidate/fx-991MS.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs candidate/fx-991MS.apk | tee candidate/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging candidate/fx-991MS.apk | tee candidate/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree candidate/fx-991MS.apk AndroidManifest.xml | tee candidate/manifest-tree.txt
          unzip -l candidate/fx-991MS.apk | tee candidate/apk-files.txt
          grep -q 'res/drawable/fx991ms_app_icon.xml' candidate/apk-files.txt
          grep -q 'application: label=' candidate/badging.txt
      - name: Package exact source used for build
        run: |
          cat > SOURCE_README.md <<'EOF'
          # fx-991MS Android source — icon release

          This archive contains the exact source tree used to build the accompanying tested APK.

          Build requirements:
          - JDK 17
          - Gradle wrapper included
          - Android SDK platform 35 / build-tools 35.0.0

          Build command:
              ./gradlew clean :app:assembleRelease

          Runtime gate used for the release:
          - Android API 23
          - Android API 29
          - Android API 35
          - install, cold launch, interaction, repeated relaunch and logcat fatal scan

          Launcher icon resource:
              app/src/main/res/drawable/fx991ms_app_icon.xml

          Package:
              com.veektall.fx991ms

          Version:
              1.1.0 (versionCode 4)
          EOF
          rm -rf source-package
          mkdir -p source-package/fx-991MS-source
          for p in app gradle gradlew gradlew.bat settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties ci tools fxicon SOURCE_README.md; do
            if [ -e "$p" ]; then cp -a "$p" source-package/fx-991MS-source/; fi
          done
          rm -rf source-package/fx-991MS-source/app/build
          find source-package/fx-991MS-source -name '.gradle' -type d -prune -exec rm -rf {} + || true
          (cd source-package && zip -qr ../candidate/fx-991MS-source.zip fx-991MS-source)
          test -s candidate/fx-991MS-source.zip
          unzip -l candidate/fx-991MS-source.zip | tee candidate/source-files.txt
          grep -q 'app/src/main/res/drawable/fx991ms_app_icon.xml' candidate/source-files.txt
          sha256sum candidate/fx-991MS-source.zip | tee candidate/SOURCE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fx991ms-candidate-icon-source
          path: |
            candidate/
            engine-test.txt
          retention-days: 7

  e2e:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Rehydrate test support
        run: |
          { head -c 7000 fxparts/part00; cat fxparts/part01 fxparts/part02 fxparts/part03 fxparts/part04 fxparts/part05 fxparts/part06; } | base64 -d | tar -xzf -
          chmod +x ci/e2e-fixed.sh
      - uses: actions/download-artifact@v4
        with:
          name: fx991ms-candidate-icon-source
          path: downloaded
      - name: Locate exact candidate
        run: |
          mkdir -p candidate
          cp downloaded/candidate/fx-991MS.apk candidate/fx-991MS.apk 2>/dev/null || cp downloaded/fx-991MS.apk candidate/fx-991MS.apk
          sha256sum candidate/fx-991MS.apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi
      - name: Emulator install / launch / interaction / relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: bash ci/e2e-fixed.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx991ms-icon-e2e-api-${{ matrix.api-level }}
          path: e2e-out/
          retention-days: 7

  final:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fx991ms-candidate-icon-source
          path: downloaded
      - name: Final binary and source identity gate
        run: |
          mkdir -p final
          cp downloaded/candidate/fx-991MS.apk final/fx-991MS-v1.1.0.apk 2>/dev/null || cp downloaded/fx-991MS.apk final/fx-991MS-v1.1.0.apk
          cp downloaded/candidate/fx-991MS-source.zip final/fx-991MS-v1.1.0-source.zip 2>/dev/null || cp downloaded/fx-991MS-source.zip final/fx-991MS-v1.1.0-source.zip
          APK_SHA=$(awk '{print $1}' downloaded/candidate/SHA256SUMS.txt 2>/dev/null || awk '{print $1}' downloaded/SHA256SUMS.txt)
          SRC_SHA=$(awk '{print $1}' downloaded/candidate/SOURCE_SHA256.txt 2>/dev/null || awk '{print $1}' downloaded/SOURCE_SHA256.txt)
          echo "$APK_SHA  fx-991MS-v1.1.0.apk" > final/SHA256SUMS.txt
          echo "$SRC_SHA  fx-991MS-v1.1.0-source.zip" >> final/SHA256SUMS.txt
          (cd final && sha256sum -c SHA256SUMS.txt)
          test -s final/fx-991MS-v1.1.0.apk
          test -s final/fx-991MS-v1.1.0-source.zip
          echo "BUILD PASS"
          echo "ICON RESOURCE PASS"
          echo "SOURCE PACKAGE PASS"
          echo "INSTALL PASS on API 23/29/35"
          echo "COLD LAUNCH PASS"
          echo "INTERACTION PASS"
          echo "RELAUNCH PASS"
          echo "LOGCAT FATAL SCAN PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: fx-991MS-v1.1.0-FINAL
          path: final/
          retention-days: 7

  report:
    if: always()
    needs: [build, e2e, final]
    runs-on: ubuntu-latest
    steps:
      - name: Report release gate
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          FINAL_RESULT: ${{ needs.final.result }}
        run: |
          gh issue comment 133 --repo "$GITHUB_REPOSITORY" --body "fx-991MS icon/source gate run ${GITHUB_RUN_ID}: build=${BUILD_RESULT}; e2e=${E2E_RESULT}; final=${FINAL_RESULT}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
