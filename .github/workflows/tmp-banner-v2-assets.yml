name: Temporary Export Banner V2 Assets

on:
  pull_request:
    branches: [main]

jobs:
  export-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          fetch() { curl -A 'Mozilla/5.0' -L --fail --retry 3 --connect-timeout 30 "$1" -o "$2"; }
          fetch 'https://camo.githubusercontent.' assets/golden-morn.webp
          fetch 'https://camo.githubusercontent.com/df0a758007b0185344e23564dc6da7b394528574ca0115feef58dba2f45250d2/68747470733a2f2f7777772e6d696c6f2e636f6d2e6e672f73697465732f64656661756c742f66696c65732f323032342d30382f4d494c4f5f4163746976476f5f383030675f4368616d705f536f66747061636b5f41314e315f656e4e475f6f70742e706e67' assets/milo.png
          fetch 'https://camo.githubusercontent.com/cb10fab944a52f49aff29a8197b42ff64cd57e10b4dcbdc41f580e4b7e33324c/68747470733a2f2f696e646f6d69652e6e672f77702d636f6e74656e742f75706c6f6164732f323032332f30342f436869636b656e2d3730672d7573652e706e67' assets/indomie.png
          fetch 'https://camo.githubusercontent.' assets/maggi.png
          fetch 'https://camo.githubusercontent.com/8c7b7daa8b729b6e1feba10c98807b54576a709c39f9452cf0f3a2122a54a5b8/68747470733a2f2f7777772e646574746f6c2e636f6d2e6e672f7374617469632f34623965336233313561626137323432616335363564356162663435373639642f65616437662f646574746f6c2d61736c2d6d65642d305f3136352e706e67' assets/dettol-liquid.png
          fetch 'https://camo.githubusercontent.com/f8c2f42ee5ea501dd08aed48c5d6e1cc8c35983629810ada6ec2109c5f33e5e6/68747470733a2f2f7777772e646574746f6c2e636f6d2e6e672f7374617469632f64653730633766663336656262343931623662346261656530356531343832302f33616361352f646574746f6c2d6f726967696e616c2d6261722d313130672e706e67' assets/dettol-soap.png
          fetch 'https://camo.githubusercontent.com/3ebf1a2f455b17c001f96274d3fd29ffa3e5dd39e57a625041d0bd2fa9ef81e2/68747470733a2f2f65752d776573742d322e67726170686173736574732e636f6d2f41785138595469394c5443724f65523070507577667a2f636d6b3379783264643135696c30376c636f35637965397a79' assets/moniepoint-logo.png
          file assets/*
      - name: Upload asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: kings-world-banner-v2-assets
          path: assets
          if-no-files-found: error
