name: Subway Surfers Video Corpus Pilot

on:
  push:
    branches: [subway-video-corpus]
    paths:
      - 'subway_ai/data/video_manifest.csv'
      - 'subway_ai/data/stage4_pilot_semantic.json'
      - 'subway_ai/scripts/prepare_video_corpus.py'
      - 'subway_ai/scripts/finalize_corpus_metadata.py'
      - 'subway_ai/scripts/infer_pseudo_actions.py'
      - 'subway_ai/video-corpus-trigger.txt'
      - '.github/workflows/subway-video-corpus.yml'

permissions:
  contents: read

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install corpus tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install 'yt-dlp>=2025.8.22' numpy pillow opencv-python-headless
      - name: Acquire one approved direct-media pilot
        run: |
          set -euxo pipefail
          rm -rf /tmp/subway-video-corpus
          mkdir -p /tmp/subway-video-corpus/raw
          python - <<'PY' > /tmp/approved.tsv
          import csv
          rows=[r for r in csv.DictReader(open('subway_ai/data/video_manifest.csv')) if r['auto_ingest'].lower()=='yes' and r.get('direct_media_url')]
          if not rows:
              raise SystemExit('no approved direct-media source in manifest')
          r=rows[0]
          print(r['source_id']+'\t'+r['direct_media_url'])
          PY
          IFS=$'\t' read -r SID MEDIA_URL < /tmp/approved.tsv
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' "$MEDIA_URL" -o "/tmp/subway-video-corpus/raw/${SID}.mp4"
          test -s "/tmp/subway-video-corpus/raw/${SID}.mp4"
          ffprobe -v error -show_entries format=duration:stream=width,height,avg_frame_rate -of json "/tmp/subway-video-corpus/raw/${SID}.mp4"
      - name: Build canonical pilot corpus
        run: |
          set -euxo pipefail
          python subway_ai/scripts/prepare_video_corpus.py \
            --manifest subway_ai/data/video_manifest.csv \
            --out /tmp/subway-video-corpus \
            --max-sources 1 \
            --max-seconds 30 \
            --clip-seconds 4 \
            --stride-seconds 2
          python subway_ai/scripts/finalize_corpus_metadata.py \
            --manifest subway_ai/data/video_manifest.csv \
            --root /tmp/subway-video-corpus
          cat /tmp/subway-video-corpus/summary.json
      - name: Stage 4 pixel-only action candidates and pseudo-label merge
        run: |
          set -euxo pipefail
          if [ -f subway_ai/data/stage4_pilot_semantic.json ]; then
            python subway_ai/scripts/infer_pseudo_actions.py \
              --root /tmp/subway-video-corpus \
              --semantic-labels subway_ai/data/stage4_pilot_semantic.json
          else
            python subway_ai/scripts/infer_pseudo_actions.py \
              --root /tmp/subway-video-corpus
          fi
          cat /tmp/subway-video-corpus/stage4_summary.json
          du -sh /tmp/subway-video-corpus || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subway-video-corpus-stage4-pilot
          path: |
            /tmp/subway-video-corpus/summary.json
            /tmp/subway-video-corpus/index.jsonl
            /tmp/subway-video-corpus/contact-sheet.jpg
            /tmp/subway-video-corpus/clips
            /tmp/subway-video-corpus/stage4_summary.json
            /tmp/subway-video-corpus/stage4_candidates.jsonl
            /tmp/subway-video-corpus/stage4_signals.csv
            /tmp/subway-video-corpus/stage4-contact-sheet.jpg
            /tmp/subway-video-corpus/stage4_review_clips
            /tmp/subway-video-corpus/pseudo_actions.jsonl
          retention-days: 1
          if-no-files-found: warn
