name: Subway Surfers Video Corpus Pilot

on:
  push:
    branches: [subway-video-corpus]
    paths:
      - 'subway_ai/data/video_manifest.csv'
      - 'subway_ai/scripts/prepare_video_corpus.py'
      - 'subway_ai/scripts/capture_youtube_media.js'
      - 'subway_ai/video-corpus-trigger.txt'
      - '.github/workflows/subway-video-corpus.yml'

permissions:
  contents: read

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install corpus tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install 'yt-dlp>=2025.8.22' numpy pillow
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser-capture one approved Creative Commons source
        run: |
          set -euxo pipefail
          rm -rf /tmp/subway-video-corpus
          mkdir -p /tmp/subway-video-corpus/raw
          python - <<'PY' > /tmp/approved.tsv
          import csv
          rows=[r for r in csv.DictReader(open('subway_ai/data/video_manifest.csv')) if r['auto_ingest'].lower()=='yes']
          for r in rows[:1]: print(r['source_id']+'\t'+r['url'])
          PY
          IFS=$'\t' read -r SID URL < /tmp/approved.tsv
          node subway_ai/scripts/capture_youtube_media.js "$URL" "/tmp/subway-video-corpus/raw/${SID}.webm" 30
          ffprobe -v error -show_entries format=duration:stream=width,height -of json "/tmp/subway-video-corpus/raw/${SID}.webm"
      - name: Build canonical pilot corpus
        run: |
          set -euxo pipefail
          python subway_ai/scripts/prepare_video_corpus.py \
            --manifest subway_ai/data/video_manifest.csv \
            --out /tmp/subway-video-corpus \
            --max-sources 1 \
            --max-seconds 30 \
            --clip-seconds 4 \
            --stride-seconds 2
          cat /tmp/subway-video-corpus/summary.json
          du -sh /tmp/subway-video-corpus || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subway-video-corpus-pilot
          path: |
            /tmp/subway-video-corpus/summary.json
            /tmp/subway-video-corpus/index.jsonl
            /tmp/subway-video-corpus/contact-sheet.jpg
            /tmp/subway-video-corpus/clips
          retention-days: 1
          if-no-files-found: warn
