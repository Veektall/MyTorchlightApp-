name: Stage PocketPilot for Telegram

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-stage-pocketpilot.yml'

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download PocketPilot build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Veektall/MyTorchlightApp-/actions/artifacts/9161707306/zip \
            -o /tmp/pocketpilot.zip
          mkdir -p /tmp/pocketpilot
          unzip -q /tmp/pocketpilot.zip -d /tmp/pocketpilot
          test -s /tmp/pocketpilot/app-debug.apk

      - name: Encrypt APK and create private metadata artifact
        run: |
          python -m pip install --quiet cryptography
          mkdir -p .telegram-relay/staging /tmp/telegram-meta
          python - <<'PY'
          import os, uuid, json, base64
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          apk = Path('/tmp/pocketpilot/app-debug.apk').read_bytes()
          key = os.urandom(32)
          iv = os.urandom(12)
          ciphertext = AESGCM(key).encrypt(iv, apk, None)
          name = f'pocketpilot-{uuid.uuid4()}.apk.enc'
          out = Path('.telegram-relay/staging') / name
          out.write_bytes(ciphertext)
          meta = {
              'staged_name': name,
              'raw_url': f'https://raw.githubusercontent.com/Veektall/MyTorchlightApp-/main/.telegram-relay/staging/{name}',
              'key': base64.b64encode(key).decode(),
              'iv': base64.b64encode(iv).decode(),
              'filename': 'PocketPilot.apk',
              'mime_type': 'application/vnd.android.package-archive'
          }
          Path('/tmp/telegram-meta/meta.json').write_text(json.dumps(meta, separators=(',', ':')))
          PY

      - name: Commit ciphertext only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .telegram-relay/staging/*.enc
          git commit -m 'Stage encrypted PocketPilot APK for Telegram'
          git push origin main

      - name: Upload staging metadata
        uses: actions/upload-artifact@v4
        with:
          name: pocketpilot-telegram-meta
          path: /tmp/telegram-meta/meta.json
          retention-days: 1
