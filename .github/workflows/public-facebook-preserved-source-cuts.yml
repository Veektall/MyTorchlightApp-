name: Public Facebook Preserved Source Cuts

on:
  push:
    branches: [main]
    paths:
      - '.trigger/facebook-preserved-cuts.json'

permissions:
  contents: read
  actions: read

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Parse request
        id: req
        run: |
          python - <<'PY'
          import json,re,os
          d=json.load(open('.trigger/facebook-preserved-cuts.json'))
          job=d['job_id'].strip(); run_id=str(d['source_run_id']); artifact=d['artifact_name'].strip(); clips=d['clips']
          expected=d['expected_source_sha256'].strip().lower()
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,128}',job): raise SystemExit('bad job_id')
          if not run_id.isdigit(): raise SystemExit('bad source_run_id')
          if not artifact.startswith('source-'): raise SystemExit('bad artifact_name')
          if not re.fullmatch(r'[0-9a-f]{64}',expected): raise SystemExit('bad source hash')
          if len(clips)!=6: raise SystemExit('exactly six clips required')
          for i,c in enumerate(clips,1):
              if c['index']!=i or float(c['end'])<=float(c['start']): raise SystemExit('bad clip range')
              if not re.fullmatch(r'[A-Za-z0-9._-]+\.mp4',c['filename']): raise SystemExit('bad filename')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'job_id={job}\nrun_id={run_id}\nartifact={artifact}\nexpected={expected}\n')
          PY

      - name: Download exact preserved source
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.req.outputs.artifact }}
          path: source-artifact
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip

      - name: Verify preserved source
        id: source
        env:
          JOB_ID: ${{ steps.req.outputs.job_id }}
          EXPECTED: ${{ steps.req.outputs.expected }}
        run: |
          set -euo pipefail
          mkdir -p "out/$JOB_ID/clips"
          SRC="$(find source-artifact -type f -name 'source.mp4' -size +0c | head -1)"
          test -n "$SRC"; test -s "$SRC"
          ACTUAL="$(sha256sum "$SRC" | awk '{print $1}')"
          echo "$ACTUAL  $SRC" | tee "out/$JOB_ID/source-sha256.txt"
          test "$ACTUAL" = "$EXPECTED"
          ffprobe -v error -show_format -show_streams -of json "$SRC" > "out/$JOB_ID/source-ffprobe.json"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

      - name: Make six contiguous source trims
        env:
          JOB_ID: ${{ steps.req.outputs.job_id }}
          SRC: ${{ steps.source.outputs.src }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,pathlib,os
          d=json.load(open('.trigger/facebook-preserved-cuts.json')); j=os.environ['JOB_ID']; src=os.environ['SRC']
          outdir=pathlib.Path(f'out/{j}/clips'); outdir.mkdir(parents=True,exist_ok=True)
          source_probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',src]))
          sv=next(s for s in source_probe['streams'] if s.get('codec_type')=='video')
          source_wh=(int(sv['width']),int(sv['height']))
          manifest=[]
          for c in d['clips']:
              start=float(c['start']); end=float(c['end']); dur=end-start
              out=str(outdir/c['filename'])
              # One contiguous source interval only. No crop, scale, captions, overlays,
              # transitions, audio processing, internal cuts, reordering or added media.
              cmd=['ffmpeg','-y','-v','error','-ss',f'{start:.3f}','-i',src,'-t',f'{dur:.3f}',
                   '-map','0:v:0','-map','0:a:0?','-c:v','libx264','-preset','fast','-crf','18',
                   '-pix_fmt','yuv420p','-c:a','aac','-b:a','192k','-movflags','+faststart',out]
              subprocess.run(cmd,check=True)
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',out]))
              actual=float(probe['format']['duration'])
              streams=probe['streams']; vids=[s for s in streams if s.get('codec_type')=='video']; auds=[s for s in streams if s.get('codec_type')=='audio']
              if abs(actual-dur)>0.35: raise SystemExit(f'duration mismatch {c["filename"]}: {actual} vs {dur}')
              if not vids or not auds: raise SystemExit(f'missing A/V stream in {c["filename"]}')
              if (int(vids[0]['width']),int(vids[0]['height'])) != source_wh: raise SystemExit(f'resolution changed in {c["filename"]}')
              subprocess.run(['ffmpeg','-v','error','-i',out,'-f','null','-'],check=True)
              manifest.append({**c,'requested_duration':round(dur,3),'actual_duration':actual,'resolution':f'{source_wh[0]}x{source_wh[1]}','edit':'single contiguous source trim only'})
          pathlib.Path(f'out/{j}/clips-manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY

      - name: Package and verify final ZIP
        env:
          JOB_ID: ${{ steps.req.outputs.job_id }}
        run: |
          set -euo pipefail
          test "$(find "out/$JOB_ID/clips" -maxdepth 1 -name '*.mp4' | wc -l)" -eq 6
          cd "out/$JOB_ID/clips"
          zip -0 -j "../${JOB_ID}_6_viral_clips.zip" ./*.mp4
          cd - >/dev/null
          unzip -t "out/$JOB_ID/${JOB_ID}_6_viral_clips.zip"
          test "$(unzip -Z1 "out/$JOB_ID/${JOB_ID}_6_viral_clips.zip" | grep -c '\.mp4$')" -eq 6
          sha256sum "out/$JOB_ID/${JOB_ID}_6_viral_clips.zip" > "out/$JOB_ID/final-zip-sha256.txt"

      - name: Upload final deliverable
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ steps.req.outputs.job_id }}
          path: |
            out/${{ steps.req.outputs.job_id }}/${{ steps.req.outputs.job_id }}_6_viral_clips.zip
            out/${{ steps.req.outputs.job_id }}/clips-manifest.json
            out/${{ steps.req.outputs.job_id }}/source-sha256.txt
            out/${{ steps.req.outputs.job_id }}/source-ffprobe.json
            out/${{ steps.req.outputs.job_id }}/final-zip-sha256.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
