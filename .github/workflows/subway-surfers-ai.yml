name: Subway Surfers Vision Agent

on:
  push:
    branches: [pixel-subway-acquire]
    paths:
      - 'subway-surfers-ai-trigger.txt'

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux vision runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y mesa-utils libgl1-mesa-dri ffmpeg
      - name: Run pixel-only VisionAgent v0.1
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euxo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' node subway-surfer-ai.js
          if [ -f /tmp/subway-ai/vision-agent.webm ]; then
            ffmpeg -y -loglevel warning -i /tmp/subway-ai/vision-agent.webm -c:v libx264 -pix_fmt yuv420p /tmp/subway-ai/vision-agent.mp4 || true
          fi
          find /tmp/subway-ai -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subway-surfers-vision-agent-v01
          path: /tmp/subway-ai
          retention-days: 1
          if-no-files-found: error
