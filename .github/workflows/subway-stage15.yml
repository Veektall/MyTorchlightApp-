name: Subway Stage 15 Evaluator Repair
on:
  push:
    branches: [subway-video-corpus]
    paths:
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v2.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v3.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v4.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v5.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v6.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v7.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v8.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v9.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v10.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v11.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v12.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v13.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v14.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v15.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v16.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v17.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v18.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v19.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v20.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v21.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v22.py'
      - 'subway_ai/scripts/evaluate_stage15_pixel_evaluator_v23.py'
      - '.github/workflows/subway-stage15.yml'
      - 'subway_ai/stage15-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  stage15:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      STAGE13_SOURCE_RUN: '33313827136'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subway-video-corpus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluator runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri tesseract-ocr tesseract-ocr-eng ffmpeg
          python -m pip install --upgrade pip
          pip install numpy pillow pytesseract
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Download Stage-13 accepted policy
        uses: actions/download-artifact@v4
        with:
          name: subway-stages13-14
          path: /tmp/stage13-source
          github-token: ${{ github.token }}
          run-id: ${{ env.STAGE13_SOURCE_RUN }}
      - name: Locate Stage-13 checkpoint
        run: |
          echo "STAGE13_CKPT=$(find /tmp/stage13-source -name stage13_policy.pt | head -1)" >> "$GITHUB_ENV"
      - name: Stage 15 repaired pixel evaluator
        continue-on-error: true
        run: |
          mkdir -p /tmp/subway-stage15
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
            python subway_ai/scripts/evaluate_stage15_pixel_evaluator_v23.py \
            --checkpoint "$STAGE13_CKPT" --out /tmp/subway-stage15 \
            --learned-episodes 3 --watchdog-seconds 180
      - name: Publish durable Stage 15 status
        if: always()
        run: |
          mkdir -p subway_ai/status
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/subway-stage15/stage15_summary.json')
          s=json.loads(p.read_text()) if p.exists() else None
          out={'workflow':'subway-stage15','run_id':os.getenv('GITHUB_RUN_ID'),'head_sha':os.getenv('GITHUB_SHA'),'stage13_completed':True,'stage14_completed':True,'stage15':s,'stage15_completed':bool(s and s.get('completed')),'all_requested_stages_completed':bool(s and s.get('completed')),'competence_claim':bool(s and s.get('competence_claim')),'highest_learned_score':s.get('highest_learned_score') if s else None,'highest_score_video':s.get('highest_score_video') if s else None,'geometry_comparison_started':False}
          Path('subway_ai/status/stage15-latest.json').write_text(json.dumps(out,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+Veektall@users.noreply.github.com
          git add subway_ai/status/stage15-latest.json
          git commit -m 'status: publish Stage 15 evaluator result' || true
          git pull --rebase origin subway-video-corpus || true
          git push origin HEAD:subway-video-corpus
      - name: Upload Stage 15 gameplay and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subway-stage15-gameplay
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/subway-stage15/stage15_summary.json
            /tmp/subway-stage15/*.webm
            /tmp/subway-stage15/*_final.png
      - name: Enforce Stage 15 evaluator completion
        if: always()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('subway_ai/status/stage15-latest.json'))
          raise SystemExit(0 if p['all_requested_stages_completed'] else 71)
          PY
