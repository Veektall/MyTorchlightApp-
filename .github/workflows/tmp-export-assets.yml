name: Temporary Export Banner Assets

on:
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: exact-banner-assets
          path: tmp-banner-assets
          if-no-files-found: error
