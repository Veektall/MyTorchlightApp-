name: Public Facebook Push Worker

on:
  push:
    branches: [main]
    paths:
      - '.trigger/facebook-job.json'

permissions:
  contents: write
  actions: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse job
        id: req
        run: |
          python - <<'PY'
          import json,re,os
          d=json.load(open('.trigger/facebook-job.json'))
          u=d['url'].strip(); j=d['job_id'].strip()
          if not u.startswith('https://www.facebook.com/'): raise SystemExit('Facebook URL required')
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,128}',j): raise SystemExit('bad job_id')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'url={u}\njob_id={j}\n')
          PY

      - name: Install media and transcript tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --upgrade pip 'yt-dlp[default,curl-cffi]' fdown-api faster-whisper

      - name: Resolve Facebook metadata
        env:
          URL: ${{ steps.req.outputs.url }}
          JOB_ID: ${{ steps.req.outputs.job_id }}
        run: |
          set +e
          mkdir -p "work/$JOB_ID" "out/$JOB_ID"
          yt-dlp --skip-download --dump-single-json "$URL" > "out/$JOB_ID/facebook-meta-full.json" 2>"out/$JOB_ID/meta.log"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            yt-dlp --impersonate chrome --skip-download --dump-single-json "$URL" > "out/$JOB_ID/facebook-meta-full.json" 2>>"out/$JOB_ID/meta.log"
          fi
          python - <<'PY'
          import json,os,pathlib
          j=os.environ['JOB_ID']; p=pathlib.Path(f'out/{j}/facebook-meta-full.json')
          try: m=json.loads(p.read_text())
          except Exception: m={}
          keep={k:m.get(k) for k in ['id','title','description','uploader','uploader_id','timestamp','webpage_url','duration']}
          pathlib.Path(f'out/{j}/facebook-meta.json').write_text(json.dumps(keep,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          exit 0

      - name: Download exact source
        env:
          URL: ${{ steps.req.outputs.url }}
          JOB_ID: ${{ steps.req.outputs.job_id }}
        run: |
          set -u
          LOG="out/$JOB_ID/download.log"; : > "$LOG"; ok=0
          if yt-dlp --no-playlist --merge-output-format mp4 -f 'bv*+ba/b' -o "work/$JOB_ID/source.%(ext)s" "$URL" >>"$LOG" 2>&1; then ok=1; fi
          if [ "$ok" -eq 0 ]; then
            rm -f "work/$JOB_ID"/source.*
            if yt-dlp --impersonate chrome --no-playlist --merge-output-format mp4 -f 'bv*+ba/b' -o "work/$JOB_ID/source.%(ext)s" "$URL" >>"$LOG" 2>&1; then ok=1; fi
          fi
          if [ "$ok" -eq 0 ]; then
            rm -f "work/$JOB_ID"/source.*
            if python - <<'PY' >>"$LOG" 2>&1
          import os
          from fdown_api import Fdown
          f=Fdown(timeout=90); links=f.get_links(os.environ['URL']); j=os.environ['JOB_ID']
          q='best' if getattr(links,'hdlink',None) else 'normal'
          f.download_video(links,quality=q,filename='source.mp4',dir=f'work/{j}',progress_bar=False,quiet=True)
          PY
            then ok=1; fi
          fi
          SRC="$(find "work/$JOB_ID" -maxdepth 1 -type f -name 'source.*' -size +0c | head -1 || true)"
          test "$ok" -eq 1; test -n "$SRC"; test -s "$SRC"
          if [ "$SRC" != "work/$JOB_ID/source.mp4" ]; then
            ffmpeg -y -v error -i "$SRC" -map 0 -c copy "work/$JOB_ID/source.mp4" || ffmpeg -y -v error -i "$SRC" -c:v libx264 -preset veryfast -crf 18 -c:a aac -b:a 192k "work/$JOB_ID/source.mp4"
          fi
          ffprobe -v error -show_format -show_streams -of json "work/$JOB_ID/source.mp4" > "out/$JOB_ID/ffprobe.json"
          sha256sum "work/$JOB_ID/source.mp4" > "out/$JOB_ID/SHA256SUMS.txt"

      - name: Upload verified source immediately
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ steps.req.outputs.job_id }}
          path: |
            work/${{ steps.req.outputs.job_id }}/source.mp4
            out/${{ steps.req.outputs.job_id }}/ffprobe.json
            out/${{ steps.req.outputs.job_id }}/SHA256SUMS.txt
            out/${{ steps.req.outputs.job_id }}/facebook-meta.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Build full timestamped transcript
        env:
          JOB_ID: ${{ steps.req.outputs.job_id }}
        run: |
          set -euo pipefail
          ffmpeg -y -v error -i "work/$JOB_ID/source.mp4" -vn -ac 1 -ar 16000 "work/$JOB_ID/audio.wav"
          python - <<'PY'
          import os
          from faster_whisper import WhisperModel
          j=os.environ['JOB_ID']; m=WhisperModel('tiny.en',device='cpu',compute_type='int8')
          segs,_=m.transcribe(f'work/{j}/audio.wav',vad_filter=True,beam_size=2)
          def ts(s):
              h=int(s//3600); s-=h*3600; mi=int(s//60); s-=mi*60; return f'{h:02d}:{mi:02d}:{s:06.3f}'
          with open(f'out/{j}/transcript.txt','w',encoding='utf-8') as f:
              for x in segs:
                  t=' '.join(x.text.split())
                  if t: f.write(f'[{ts(x.start)} --> {ts(x.end)}] {t}\n')
          PY
          test -s "out/$JOB_ID/transcript.txt"

      - name: Build manifest
        env:
          JOB_ID: ${{ steps.req.outputs.job_id }}
          URL: ${{ steps.req.outputs.url }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          j=os.environ['JOB_ID']; p=json.load(open(f'out/{j}/ffprobe.json')); fmt=p['format']
          d={'job_id':j,'source_url':os.environ['URL'],'duration_seconds':float(fmt.get('duration',0)),'size_bytes':int(fmt.get('size',0)),'source_sha256':open(f'out/{j}/SHA256SUMS.txt').read().split()[0],'transcript_source':'faster-whisper-tiny.en','workflow_run_id':os.environ['GITHUB_RUN_ID']}
          pathlib.Path(f'out/{j}/manifest.json').write_text(json.dumps(d,indent=2),encoding='utf-8')
          PY

      - name: Publish analysis package
        env:
          JOB_ID: ${{ steps.req.outputs.job_id }}
        run: |
          set -euo pipefail
          D="public-facebook-jobs/$JOB_ID"; mkdir -p "$D"
          cp "out/$JOB_ID/manifest.json" "$D/manifest.json"
          cp "out/$JOB_ID/ffprobe.json" "$D/ffprobe.json"
          cp "out/$JOB_ID/SHA256SUMS.txt" "$D/SHA256SUMS.txt"
          cp "out/$JOB_ID/download.log" "$D/download.log"
          cp "out/$JOB_ID/facebook-meta.json" "$D/facebook-meta.json"
          cp "out/$JOB_ID/transcript.txt" "$D/transcript.txt"
          git config user.name chatgpt-actions; git config user.email actions@users.noreply.github.com
          git add "$D"; git commit -m "Publish Facebook push analysis $JOB_ID"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
