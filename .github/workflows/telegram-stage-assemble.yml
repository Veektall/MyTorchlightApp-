name: Telegram stage assembler

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  assemble:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'telegram-stage:') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Assemble encrypted stage
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ID=2fae108c5a9d4b778b0165e055f74c2e
          OUT=.telegram-relay/staging/telegram-status-ping-v5-1-${ID}.enc
          mkdir -p .telegram-relay/staging
          cat .telegram-relay/chunks/${ID}.part* | tr -d '\n' | base64 -d > "$OUT"
          test "$(sha256sum "$OUT" | awk '{print $1}')" = "a6e024a3cdd28cd0c3d986d47138aaee5e4408336acebd31f5da9b398697a52d"
          rm -f .telegram-relay/chunks/${ID}.part*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git add -u .telegram-relay/chunks
          git rm .github/workflows/telegram-stage-assemble.yml
          git commit -m "Assemble encrypted Telegram v5.1 staging file"
          git push
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Encrypted Telegram staging assembled."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
