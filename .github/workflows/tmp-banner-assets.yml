name: Temporary Banner Asset Fetch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch-assets:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-banner-assets
          fetch() { curl -A 'Mozilla/5.0' -L --fail --retry 3 --connect-timeout 20 "$1" -o "$2"; }
          fetch 'https://static.opayweb.com/static/pos-tool-29c31107e74e0312ad5b2dd2ae47840c.png' tmp-banner-assets/opay.png
          fetch 'https://www.shelaf.net/wp-content/uploads/2025/03/OPay-POS.webp' tmp-banner-assets/opay-real.webp
          fetch 'https://pictures-nigeria.jijistatic.net/193996257_NjIwLTk5NS1jZTM1OGE5MTJj.webp' tmp-banner-assets/opay-hires.webp
          fetch 'https://www.moniepoint.com/pos/smart.png' tmp-banner-assets/moniepoint.png
          fetch 'https://www.peakmilk.com.ng/wp-content/uploads/2022/03/Peak-FullCream-150g-Tin-e1754669118736.png' tmp-banner-assets/peak.png
      - name: Commit exact assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-banner-assets
          git commit -m 'chore: temporary exact banner assets [skip ci]'
          git push
