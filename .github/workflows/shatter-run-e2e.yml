name: Shatter Run Android E2E

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/shatter-run-e2e.yml'
      - 'shatter-e2e/**'

permissions:
  contents: read

jobs:
  emulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android compile tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build exact gameplay/UI code
        run: |
          chmod +x shatter-e2e/build.sh
          ./shatter-e2e/build.sh
          test -s shatter-e2e/build/ShatterRun-CI.apk

      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Run Android emulator acceptance test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            set -euxo pipefail
            mkdir -p e2e-artifacts
            adb install -r shatter-e2e/build/ShatterRun-CI.apk
            adb logcat -c
            adb shell am force-stop com.victorojo.shatterrun
            adb shell am start -W -n com.victorojo.shatterrun/.MainActivity
            sleep 2

            dump_state() {
              name="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml "e2e-artifacts/${name}.xml" >/dev/null
              adb exec-out screencap -p > "e2e-artifacts/${name}.png"
              grep -o 'Shatter Run[^\"]*' "e2e-artifacts/${name}.xml" || true
            }

            dump_state 01_menu
            grep -q 'state menu' e2e-artifacts/01_menu.xml
            grep -q 'balls 25' e2e-artifacts/01_menu.xml

            read W H < <(python3 - <<'PY'
            import struct
            with open('e2e-artifacts/01_menu.png','rb') as f:
                d=f.read(24)
            print(*struct.unpack('>II',d[16:24]))
            PY
            )
            echo "screen=${W}x${H}"
            CX=$((W/2)); CY=$((H/2)); AIM_Y=$((H*49/100)); TOP_Y=$((H/100)); PAUSE_X=$((W*95/100)); PAUSE_Y=$((H*8/100))

            adb shell input tap "$CX" "$CY"
            sleep 0.7
            dump_state 02_playing
            grep -q 'state playing' e2e-artifacts/02_playing.xml
            grep -q 'balls 25' e2e-artifacts/02_playing.xml

            adb shell input tap "$CX" "$AIM_Y"
            sleep 0.8
            dump_state 03_crystal
            grep -q 'state playing' e2e-artifacts/03_crystal.xml
            grep -q 'crystals 1' e2e-artifacts/03_crystal.xml
            grep -q 'balls 27' e2e-artifacts/03_crystal.xml

            adb shell input tap "$PAUSE_X" "$PAUSE_Y"
            sleep 0.25
            dump_state 04_paused
            grep -q 'state paused' e2e-artifacts/04_paused.xml
            adb shell input tap "$CX" "$CY"
            sleep 0.25
            dump_state 05_resumed
            grep -q 'state playing' e2e-artifacts/05_resumed.xml

            for i in $(seq 1 27); do adb shell input tap "$CX" "$TOP_Y"; done
            sleep 5
            dump_state 06_gameover
            grep -q 'state game over' e2e-artifacts/06_gameover.xml
            grep -q 'balls 0' e2e-artifacts/06_gameover.xml

            adb shell input tap "$CX" "$CY"
            sleep 0.4
            dump_state 07_restart
            grep -q 'state playing' e2e-artifacts/07_restart.xml
            grep -q 'balls 25' e2e-artifacts/07_restart.xml
            grep -q 'crystals 0' e2e-artifacts/07_restart.xml

            adb shell pidof com.victorojo.shatterrun > e2e-artifacts/pid.txt
            adb logcat -d > e2e-artifacts/logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.victorojo\.shatterrun.*FATAL' e2e-artifacts/logcat.txt; then
              echo 'Crash detected' >&2
              exit 1
            fi
            printf 'PASS\nmenu -> playing -> crystal -> pause -> resume -> gameover -> restart\n' > e2e-artifacts/result.txt

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shatter-run-e2e-evidence
          path: e2e-artifacts/
          if-no-files-found: warn
