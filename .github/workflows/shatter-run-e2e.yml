name: Shatter Run Android E2E

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/shatter-run-e2e.yml'
      - 'shatter-e2e/**'

permissions:
  contents: read

jobs:
  emulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android compile tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build exact gameplay/UI code
        run: |
          chmod +x shatter-e2e/build.sh shatter-e2e/e2e.sh
          ./shatter-e2e/build.sh
          test -s shatter-e2e/build/ShatterRun-CI.apk

      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Run Android emulator acceptance test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -no-metrics
          script: ./shatter-e2e/e2e.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shatter-run-e2e-evidence
          path: e2e-artifacts/
          if-no-files-found: warn
