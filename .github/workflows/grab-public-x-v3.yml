name: Grab X/Twitter Android smoke v3

on:
  push:
    branches: [grab-public-e2e]
    paths:
      - .github/workflows/grab-public-x-v3.yml
      - grab-e2e/patch_x_support_v2.py
      - grab-e2e/run_x_android_smoke.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APK_URL: https://tempfile.org/jYETc6AXzB8/download
      APK_SHA256: 9e3fa24b6347ab0f5738d966b11e560b575bc22ce0b48b1027ea42418b5685d9
      X_TEST_URL: https://x.com/i/status/2087805066656813190
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Fetch known Grab test APK
        run: |
          curl -fL --retry 3 --max-time 180 "$APK_URL" -o /tmp/grab.apk
          echo "$APK_SHA256  /tmp/grab.apk" | sha256sum -c -

      - name: Patch X/Twitter routing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool
          apktool d -f -r /tmp/grab.apk -o /tmp/grab-dec >/tmp/decode.log
          MAIN="$(find /tmp/grab-dec -type f -path '*/com/veektall/grab/MainActivity.smali' | head -n1)"
          SVC="$(find /tmp/grab-dec -type f -path '*/com/veektall/grab/YouTubeDownloadService.smali' | head -n1)"
          python grab-e2e/patch_x_support_v2.py "$MAIN" "$SVC" | tee /tmp/patch.txt
          grep -q X_TWITTER_SMALI_PATCH_PASS /tmp/patch.txt

      - name: Rebuild and test-sign APK
        run: |
          apktool b /tmp/grab-dec -o /tmp/grab-x-unsigned.apk >/tmp/build.log
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/zipalign" -f -p 4 /tmp/grab-x-unsigned.apk /tmp/grab-x-aligned.apk
          keytool -genkeypair -keystore /tmp/test.jks -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Grab E2E' >/dev/null 2>&1
          "$BT/apksigner" sign --ks /tmp/test.jks --ks-pass pass:android --key-pass pass:android --out /tmp/grab-x.apk /tmp/grab-x-aligned.apk
          "$BT/apksigner" verify /tmp/grab-x.apk
          sha256sum /tmp/grab-x.apk | tee /tmp/patched-sha.txt

      - name: Android 29 exact X smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash grab-e2e/run_x_android_smoke.sh

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          test -f /tmp/grab-x.apk && cp /tmp/grab-x.apk evidence/Grab-by-Rhoda-v3.2-X-test.apk || true
          test -f /tmp/patched-sha.txt && cp /tmp/patched-sha.txt evidence/patched-sha.txt || true
          test -f /tmp/build.log && cp /tmp/build.log evidence/build.log || true
          test -f /tmp/patch.txt && cp /tmp/patch.txt evidence/patch.txt || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grab-v32-x-test-apk-and-evidence-v3
          path: evidence/
          retention-days: 3
          if-no-files-found: warn
