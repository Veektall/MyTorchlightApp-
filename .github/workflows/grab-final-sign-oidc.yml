name: Grab final signing exchange
on:
  push:
    paths:
      - '.github/workflows/grab-final-sign-oidc.yml'
      - 'ci/grab-final-sign-exchange.sh'
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run final signer
        env:
          GH_TOKEN: ${{ github.token }}
          SB_ANON: sb_publishable_uxjnA6ada7o-Ft0_GwwBJg_izt6bafz
        run: |
          sed -i 's/rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256/rsa_oaep_md:sha1 -pkeyopt rsa_mgf1_md:sha1/' ci/grab-final-sign-exchange.sh
          sed -i 's/ -H "Authorization: Bearer $SB_ANON"//' ci/grab-final-sign-exchange.sh
          sed -i '/chmod 600 "$W\/release.p12" "$W\/password.txt"/a\cp "$W/password.txt" "$W/key-password.txt"\nchmod 600 "$W/key-password.txt"' ci/grab-final-sign-exchange.sh
          sed -i 's|--key-pass "file:$W/password.txt"|--key-pass "file:$W/key-password.txt"|' ci/grab-final-sign-exchange.sh
          bash ci/grab-final-sign-exchange.sh
      - name: Upload final signed APK and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: Grab-by-Rhoda-v3.2-final-signed
          path: |
            /tmp/grab-final/Grab-by-Rhoda-v3.2.apk
            /tmp/grab-final/final-manifest.txt
            /tmp/grab-final/apksigner-verify.txt
            /tmp/grab-final/final-badging.txt
            /tmp/grab-final/zipalign-check.txt
          retention-days: 7
