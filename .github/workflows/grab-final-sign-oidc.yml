name: Grab final signing exchange
on:
  push:
    paths:
      - '.github/workflows/grab-final-sign-oidc.yml'
      - 'ci/grab-final-sign-exchange.sh'
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run final signer
        env:
          GH_TOKEN: ${{ github.token }}
          SB_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3dWxtbnZ4aHliYnhsc2Rjd2NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNzE4MzAsImV4cCI6MjEwMTc0NzgzMH0.2Sr7m5kgejO0zSGyBrd78mUUV7d_bWAsS8e4clcIPF4
        run: |
          sed -i 's/rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256/rsa_oaep_md:sha1 -pkeyopt rsa_mgf1_md:sha1/' ci/grab-final-sign-exchange.sh
          bash ci/grab-final-sign-exchange.sh
      - name: Upload final signed APK and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: Grab-by-Rhoda-v3.2-final-signed
          path: |
            /tmp/grab-final/Grab-by-Rhoda-v3.2.apk
            /tmp/grab-final/final-manifest.txt
            /tmp/grab-final/apksigner-verify.txt
            /tmp/grab-final/final-badging.txt
            /tmp/grab-final/zipalign-check.txt
          retention-days: 7
