name: Public Facebook Metadata Resolver

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  meta:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, 'public-facebook-meta:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: python -m pip install -q --upgrade 'yt-dlp[default,curl-cffi]'
      - name: Resolve metadata
        env:
          BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(python - <<'PY'
import json,os
print(json.loads(os.environ['BODY'])['url'])
PY
)"
          (yt-dlp --skip-download --dump-single-json "$URL" || yt-dlp --impersonate chrome --skip-download --dump-single-json "$URL") > /tmp/meta.json
          python - <<'PY'
import json, pathlib
m=json.load(open('/tmp/meta.json'))
out={k:m.get(k) for k in ['id','title','description','uploader','timestamp','webpage_url','duration']}
pathlib.Path('/tmp/meta-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
PY
      - name: Comment metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/meta-summary.json
