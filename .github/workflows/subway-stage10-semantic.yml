name: Subway Stage 10 Semantic
on:
  workflow_dispatch:
  push:
    branches: [subway-video-corpus]
    paths:
      - subway_ai/stage10-semantic-trigger.txt
permissions:
  contents: write
jobs:
  stage10:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      STAGE10_TEACHER_EPISODES: '8'
      STAGE10_TEACHER_SECONDS: '45'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subway-video-corpus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        id: install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg mesa-utils libgl1-mesa-dri xvfb
          pip install numpy opencv-python-headless
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 sharp@0.34.3
          npx playwright install --with-deps chromium
      - name: Collect pixel-grounded exact teacher episodes
        id: collect
        continue-on-error: true
        run: |
          rm -rf /tmp/subway-stage10-teacher /tmp/subway-stage10-work
          mkdir -p /tmp/subway-stage10-teacher /tmp/subway-stage10-work
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' node subway_ai/scripts/collect_stage10_teacher.js /tmp/subway-stage10-teacher
      - name: Build exact pre-action semantic dataset
        id: build
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python subway_ai/scripts/build_stage10_teacher_dataset.py --teacher-root /tmp/subway-stage10-teacher --root /tmp/subway-stage10-work
      - name: Train and gate Stage 10 v4
        id: train
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python subway_ai/scripts/train_stage10_v4.py --root /tmp/subway-stage10-work --pretrain-epochs 18 --policy-epochs 32
      - name: Publish durable Stage 10 status
        if: always()
        env:
          COLLECT: ${{ steps.collect.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TRAIN: ${{ steps.train.outcome }}
        run: |
          mkdir -p subway_ai/status
          python - <<'PY'
          import json,os
          from pathlib import Path
          def read(p):
              q=Path(p)
              if q.exists():
                  try:return json.loads(q.read_text())
                  except Exception as e:return {'parse_error':str(e)}
              return None
          out={'workflow':'subway-stage10-semantic','run_id':os.environ.get('GITHUB_RUN_ID'),'head_sha':os.environ.get('GITHUB_SHA'),'steps':{'collect':os.environ.get('COLLECT'),'build':os.environ.get('BUILD'),'train':os.environ.get('TRAIN')},'teacher':read('/tmp/subway-stage10-teacher/stage10_teacher_summary.json'),'dataset':read('/tmp/subway-stage10-work/stage10_dataset_summary.json'),'temporal':read('/tmp/subway-stage10-work/stage10_temporal_summary.json'),'policy':read('/tmp/subway-stage10-work/stage10_policy_summary.json')}
          out['stage10_completed']=bool(out['temporal'] and out['temporal'].get('accepted') and out['policy'] and out['policy'].get('accepted'))
          Path('subway_ai/status/stage10-latest.json').write_text(json.dumps(out,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add subway_ai/status/stage10-latest.json
          git commit -m 'status: publish Stage 10 semantic result' || true
          git push origin HEAD:subway-video-corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subway-stage10-semantic
          retention-days: 3
          path: |
            /tmp/subway-stage10-teacher/stage10_teacher_summary.json
            /tmp/subway-stage10-teacher/*-actions.json
            /tmp/subway-stage10-work/stage10_dataset_summary.json
            /tmp/subway-stage10-work/stage10_examples.jsonl
            /tmp/subway-stage10-work/stage10_temporal_summary.json
            /tmp/subway-stage10-work/stage10_policy_summary.json
            /tmp/subway-stage10-work/stage10_temporal_encoder.pt
            /tmp/subway-stage10-work/stage10_imitation_policy.pt
      - name: Enforce Stage 10 gate
        if: always()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('subway_ai/status/stage10-latest.json'))
          raise SystemExit(0 if p['stage10_completed'] else 15)
          PY
