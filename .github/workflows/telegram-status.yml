name: Telegram status relay

on:
  issues:
    types: [opened]
  schedule:
    - cron: '17 3 * * *'

permissions:
  issues: write
  id-token: write

jobs:
  relay:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'telegram-status:') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deliver encrypted Telegram status
        env:
          ENDPOINT: https://kwulmnvxhybbxlsdcwcn.supabase.co/functions/v1/telegram-status-relay
          SEALED: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Telegram relay failed."
            exit 1
          }
          trap fail ERR
          jq -e '.v == 1 and (.wrapped_key | type == "string") and (.iv | type == "string") and (.ciphertext | type == "string")' <<< "$SEALED" >/dev/null
          token_response="$(curl --fail-with-body -sS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=telegram-status-relay")"
          oidc="$(jq -r '.value // empty' <<< "$token_response")"
          test -n "$oidc"
          payload="$(jq -n --argjson sealed "$SEALED" '{sealed:$sealed}')"
          response="$(curl --fail-with-body -sS --max-time 30 -X POST "$ENDPOINT" -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" -d "$payload")"
          test "$(jq -r '.ok // false' <<< "$response")" = "true"
          message_id="$(jq -r '.message_id // "confirmed"' <<< "$response")"
          trap - ERR
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Telegram delivered successfully. Message ID: $message_id"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Keep Supabase relay warm
        run: curl --fail-with-body -sS -I --max-time 20 https://kwulmnvxhybbxlsdcwcn.supabase.co/functions/v1/telegram-status-relay >/dev/null

  netlify_deploy:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'telegram-deploy:') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy private relay source to Netlify
        env:
          ENDPOINT: https://kwulmnvxhybbxlsdcwcn.supabase.co/functions/v1/telegram-status-relay
          SEALED: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Netlify relay deployment failed."
            exit 1
          }
          trap fail ERR
          jq -e '.v == 1 and (.wrapped_key | type == "string") and (.iv | type == "string") and (.ciphertext | type == "string")' <<< "$SEALED" >/dev/null
          token_response="$(curl --fail-with-body -sS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=telegram-status-relay")"
          oidc="$(jq -r '.value // empty' <<< "$token_response")"
          test -n "$oidc"
          payload="$(jq -n --argjson sealed "$SEALED" '{sealed:$sealed}')"
          response="$(curl --fail-with-body -sS --max-time 30 -X POST "$ENDPOINT" -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" -d "$payload")"
          test "$(jq -r '.ok // false' <<< "$response")" = "true"
          private_gh_token="$(jq -r '.github_token // empty' <<< "$response")"
          netlify_proxy="$(jq -r '.netlify_proxy // empty' <<< "$response")"
          test -n "$private_gh_token" && test -n "$netlify_proxy"
          echo "::add-mask::$private_gh_token"
          echo "::add-mask::$netlify_proxy"
          git clone --depth 1 "https://x-access-token:${private_gh_token}@github.com/Veektall/fluent-booking-site.git" relay-source
          cd relay-source
          npx -y @netlify/mcp@latest --site-id 38061b35-a5ee-4cbf-9409-16417c3b442a --proxy-path "$netlify_proxy"
          cd ..
          trap - ERR
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Netlify relay deployment completed successfully."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
