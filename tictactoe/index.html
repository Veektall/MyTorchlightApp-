</style></head><body><div id="app">
<section class="screen active" id="splash"><div class="splash-stage"><div class="orb cyan"></div><div class="orb purple"></div><div class="splash-markers"><div class="mini-o"></div><div class="mini-x"></div></div><div class="splash-title gradient-text display">Tic Tac Toe</div><div class="loader-dot"></div><div class="credit">Developed by <b>Victor Ojo</b></div></div></section>

<script>(()=>{const byId=id=>document.getElementById(id);let currentScreen='splash',mode='ai',difficulty='medium',gridSize=3,winLen=3,board=[],turn='X',active=false,thinking=false,aiTimer=null,sound=true,winning=[],audioCtx=null;function showScreen(id){const old=byId(currentScreen),next=byId(id);if(old===next)return;old.classList.add('leaving');setTimeout(()=>{old.classList.remove('active','leaving');next.classList.add('active')},140);currentScreen=id}setTimeout(()=>showScreen('home'),2350);function tone(freq=440,dur=.07,type='sine',vol=.025){if(!sound)return;try{audioCtx||=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}function buzz(ms=10){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}function tapFeel(){tone(410,.045,'sine',.014);buzz(8)}byId('newGameHome').onclick=()=>{tapFeel();showScreen('mode')};document.querySelector('.back-home').onclick=()=>showScreen('home');document.querySelector('.back-mode').onclick=()=>showScreen('mode');document.querySelector('.back-size').onclick=()=>{clearTimeout(aiTimer);active=false;showScreen('size')};byId('humanMode').onclick=()=>{tapFeel();mode='human';showScreen('size')};const comp=byId('computerMode');comp.onclick=e=>{if(e.target.closest('.diff'))return;tapFeel();comp.classList.toggle('expanded');byId('computerSub').textContent=comp.classList.contains('expanded')?'Select difficulty':'Challenge the AI'};comp.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();comp.click()}};document.querySelectorAll('.diff').forEach(btn=>btn.onclick=e=>{e.stopPropagation();tapFeel();difficulty=btn.dataset.diff;document.querySelectorAll('.diff').forEach(x=>x.classList.toggle('selected',x===btn));mode='ai';setTimeout(()=>showScreen('size'),100)});document.querySelectorAll('.size-card').forEach(btn=>btn.onclick=()=>{tapFeel();gridSize=+btn.dataset.size;winLen=gridSize===5?4:3;startMatch();showScreen('game')});byId('soundBtn').onclick=()=>{sound=!sound;byId('soundBtn').style.opacity=sound?'1':'.42';if(sound)tone(650,.06,'sine',.018)};function allLines(n,k){const lines=[];for(let r=0;r<n;r++)for(let c=0;c<=n-k;c++)lines.push(Array.from({length:k},(_,i)=>r*n+c+i));for(let c=0;c<n;c++)for(let r=0;r<=n-k;r++)lines.push(Array.from({length:k},(_,i)=>(r+i)*n+c));for(let r=0;r<=n-k;r++)for(let c=0;c<=n-k;c++)lines.push(Array.from({length:k},(_,i)=>(r+i)*n+c+i));for(let r=0;r<=n-k;r++)for(let c=k-1;c<n;c++)lines.push(Array.from({length:k},(_,i)=>(r+i)*n+c-i));return lines}function getWinner(state=board){for(const line of allLines(gridSize,winLen)){const m=state[line[0]];if(m&&line.every(i=>state[i]===m))return{mark:m,line}}return null}function empties(state=board){const a=[];state.forEach((v,i)=>{if(!v)a.push(i)});return a}function render(){const el=byId('board');el.innerHTML='';el.style.gridTemplateColumns=`repeat(${gridSize},1fr)`;const gap=gridSize===5?7:gridSize===4?9:10;el.style.gap=gap+'px';board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';if(winning.includes(i))b.classList.add('winning');if(v){const m=document.createElement('span');m.className='mark '+v.toLowerCase();b.appendChild(m)}b.disabled=!active||thinking||!!v||(mode==='ai'&&turn==='O');b.onclick=()=>humanMove(i);el.appendChild(b)});if(winning.length)requestAnimationFrame(drawWinLine)}function setStatus(kind){const s=byId('status');if(kind==='thinking')s.innerHTML=`Computer Thinking <span class="thinking-dots"><i></i><i></i><i></i></span>`;else if(mode==='ai')s.textContent=turn==='X'?'Your Turn (X)':'Computer Turn (O)';else s.textContent=`Player ${turn}'s Turn (${turn})`}function startMatch(){clearTimeout(aiTimer);board=Array(gridSize*gridSize).fill('');winning=[];active=true;thinking=false;byId('resultOverlay').classList.remove('show');turn=mode==='ai'?'O':'X';byId('gameHint').textContent='';render();setStatus(mode==='ai'?'thinking':'turn');if(mode==='ai'){thinking=true;render();aiTimer=setTimeout(aiMove,760)}}function humanMove(i){if(!active||thinking||board[i])return;tapFeel();board[i]=turn;tone(turn==='X'?580:760,.08,'triangle',.025);render();if(checkEnd())return;turn=turn==='X'?'O':'X';if(mode==='ai'&&turn==='O'){thinking=true;setStatus('thinking');render();aiTimer=setTimeout(aiMove,640)}else{setStatus('turn');render()}}function randomChoice(a){return a[Math.floor(Math.random()*a.length)]}function tactical(mark){for(const i of empties()){const t=[...board];t[i]=mark;const w=getWinner(t);if(w&&w.mark===mark)return i}return null}function scorePotential(i,mark){const t=[...board];t[i]=mark;let score=0;for(const line of allLines(gridSize,winLen)){if(!line.includes(i))continue;let own=0,opp=0;for(const q of line){if(t[q]===mark)own++;else if(t[q]&&t[q]!==mark)opp++}if(!opp)score+=Math.pow(3,own)}const r=Math.floor(i/gridSize),c=i%gridSize,center=(gridSize-1)/2;score+=Math.max(0,4-(Math.abs(r-center)+Math.abs(c-center)));return score}function mediumMove(){const win=tactical('O');if(win!=null)return win;const block=tactical('X');if(block!=null)return block;const es=empties();let best=-1,bm=[];for(const i of es){const s=scorePotential(i,'O')+scorePotential(i,'X')*.7;if(s>best){best=s;bm=[i]}else if(s===best)bm.push(i)}return Math.random()<.78?randomChoice(bm):randomChoice(es)}function minimax3(state,maximizing,depth){const w=getWinner(state);if(w)return w.mark==='O'?10-depth:depth-10;if(state.every(Boolean))return 0;if(maximizing){let best=-99;for(const i of empties(state)){state[i]='O';best=Math.max(best,minimax3(state,false,depth+1));state[i]=''}return best}let best=99;for(const i of empties(state)){state[i]='X';best=Math.min(best,minimax3(state,true,depth+1));state[i]=''}return best}function hardMove(){if(gridSize===3){let best=-99,moves=[];for(const i of empties()){board[i]='O';const s=minimax3(board,false,0);board[i]='';if(s>best){best=s;moves=[i]}else if(s===best)moves.push(i)}return randomChoice(moves)}const win=tactical('O');if(win!=null)return win;const block=tactical('X');if(block!=null)return block;const es=empties();let best=-Infinity,moves=[];for(const i of es){let s=scorePotential(i,'O')*1.2+scorePotential(i,'X');if(s>best){best=s;moves=[i]}else if(s===best)moves.push(i)}return randomChoice(moves)}function aiMove(){if(!active||mode!=='ai'||turn!=='O')return;let i=difficulty==='easy'?randomChoice(empties()):difficulty==='medium'?mediumMove():hardMove();board[i]='O';thinking=false;tone(760,.09,'triangle',.023);render();if(checkEnd())return;turn='X';setStatus('turn');render()}function checkEnd(){const w=getWinner();if(w){active=false;thinking=false;winning=w.line;render();tone(w.mark==='O'?520:660,.12,'sine',.03);setTimeout(()=>tone(w.mark==='O'?660:820,.16,'sine',.028),100);setTimeout(()=>showResult(`${w.mark} Wins!`),620);return true}if(board.every(Boolean)){active=false;thinking=false;setTimeout(()=>showResult('Draw!'),350);return true}return false}function drawWinLine(){const boardEl=byId('board');const old=boardEl.querySelector('.win-line');if(old)old.remove();if(winning.length<2)return;const cells=boardEl.children,a=cells[winning[0]].getBoundingClientRect(),b=cells[winning.at(-1)].getBoundingClientRect(),br=boardEl.getBoundingClientRect();const x1=a.left+a.width/2-br.left,y1=a.top+a.height/2-br.top,x2=b.left+b.width/2-br.left,y2=b.top+b.height/2-br.top;const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;const line=document.createElement('div');line.className='win-line';line.style.left=x1+'px';line.style.top=(y1-3.5)+'px';line.style.width=len+'px';line.style.transform=`rotate(${ang}deg)`;boardEl.appendChild(line)}function showResult(text){byId('resultTitle').textContent=text;byId('resultOverlay').classList.add('show')}byId('playAgain').onclick=()=>{tapFeel();startMatch()};byId('goHome').onclick=()=>{tapFeel();byId('resultOverlay').classList.remove('show');active=false;clearTimeout(aiTimer);showScreen('home')};window.addEventListener('resize',()=>{if(winning.length)requestAnimationFrame(drawWinLine)})})();</script></body></html>
